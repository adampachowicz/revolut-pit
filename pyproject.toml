[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revolut-pit"
version = "0.1.0"
description = "Calculate Polish PIT-38 tax filing from Revolut data exports"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "revolut-pit contributors"}
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
    "streamlit>=1.20.0",
    "reportlab>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/TODO/revolut-pit"
Issues = "https://github.com/TODO/revolut-pit/issues"

[tool.setuptools]
packages = ["revolut_pit"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
